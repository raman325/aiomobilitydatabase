repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        # Keep Google's canonical sample feed byte-identical to upstream.
        exclude: ^tests/feeds/data/sample_feed/.*\.txt$
      - id: trailing-whitespace
        exclude: ^tests/feeds/data/sample_feed/.*\.txt$
      - id: check-yaml
